name: Repair sheep artwork

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-sheep.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image verifier
        run: python -m pip install --quiet pillow
      - name: Decode and recover sheep JPEG
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64
          from PIL import Image, ImageFile

          sheep = Path('assets/characters/sheep.jpg')
          raw = sheep.read_bytes()

          if not raw.startswith(b'\xff\xd8\xff'):
              compact = b''.join(raw.split())
              print(f'encoded sheep payload: raw={len(raw)}, compact={len(compact)}, mod4={len(compact) % 4}')
              compact += b'=' * (-len(compact) % 4)
              try:
                  decoded = base64.b64decode(compact, validate=True)
              except Exception as exc:
                  raise SystemExit(f'sheep.jpg is neither JPEG nor recoverable Base64: {exc}')
              if not decoded.startswith(b'\xff\xd8\xff'):
                  raise SystemExit('decoded sheep.jpg does not have JPEG SOI magic bytes')

              # The original bad upload lost the tail of the Base64 text. Pillow can
              # recover the already-present JPEG scan data, then we re-encode it as
              # a complete JPEG instead of inventing a new artwork.
              candidate = decoded if decoded.endswith(b'\xff\xd9') else decoded + b'\xff\xd9'
              try:
                  strict = Image.open(BytesIO(candidate))
                  strict.load()
                  recovered = strict.convert('RGB')
                  print('strict JPEG recovery succeeded')
              except Exception as exc:
                  print(f'strict recovery failed ({exc}); using Pillow truncated-image recovery')
                  ImageFile.LOAD_TRUNCATED_IMAGES = True
                  image = Image.open(BytesIO(candidate))
                  image.load()
                  recovered = image.convert('RGB')

              recovered.save(sheep, format='JPEG', quality=95, optimize=True)
              print(f'recovered sheep.jpg: {recovered.width}x{recovered.height}, {len(raw)} -> {sheep.stat().st_size} bytes')
          else:
              print('sheep.jpg is already a real JPEG')

          assets = [
              Path('assets/characters/cow.jpg'),
              Path('assets/characters/horse.jpg'),
              Path('assets/characters/sheep.jpg'),
              Path('assets/readme/concept.jpg'),
          ]
          for asset in assets:
              data = asset.read_bytes()
              if not data.startswith(b'\xff\xd8\xff') or not data.endswith(b'\xff\xd9'):
                  raise SystemExit(f'{asset} is not a complete JPEG')
              with Image.open(asset) as image:
                  image.load()
                  print(f'OK JPEG: {asset} ({image.width}x{image.height}, {len(data)} bytes)')
          PY
      - name: Commit repaired binary
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/characters/sheep.jpg; then
            echo 'No repair commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/sheep.jpg
          git commit -m 'fix: store sheep artwork as real JPEG'
          git push origin HEAD:main
