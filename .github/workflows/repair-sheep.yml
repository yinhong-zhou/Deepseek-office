name: Repair artwork mapping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-sheep.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install image verifier
        run: python -m pip install --quiet pillow
      - name: Restore four artwork files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64
          from PIL import Image

          chars = Path('assets/characters')
          readme = Path('assets/readme')

          # The original artwork commit shifted the four generated assets by one slot:
          # concept slot -> cow, cow slot -> horse, horse slot -> sheep,
          # sheep slot -> concept. Preserve the original image data and put it back.
          concept_slot = (readme / 'concept.jpg').read_bytes()
          cow_slot = (chars / 'cow.jpg').read_bytes()
          horse_slot = (chars / 'horse.jpg').read_bytes()
          sheep_slot = (chars / 'sheep.jpg').read_bytes()

          # Cow image: valid progressive JPEG except its chroma DQT lost its final
          # three 0x30 values, making the declared DQT segment swallow SOF2.
          sof2 = concept_slot.find(b'\xff\xc2')
          if sof2 < 0:
              raise SystemExit('cannot locate cow SOF2 marker in concept slot')
          cow = concept_slot[:sof2] + b'\x30\x30\x30' + concept_slot[sof2:]

          # Horse and sheep images were already valid JPEGs, just under wrong names.
          horse = cow_slot
          sheep = horse_slot

          # Concept image was stored as Base64 text with the final padding/EOI lost.
          compact = b''.join(sheep_slot.split())
          compact += b'=' * (-len(compact) % 4)
          concept = base64.b64decode(compact, validate=True)
          if not concept.startswith(b'\xff\xd8\xff'):
              raise SystemExit('decoded concept does not start with JPEG magic bytes')
          if not concept.endswith(b'\xff\xd9'):
              concept += b'\xff\xd9'

          outputs = {
              chars / 'cow.jpg': cow,
              chars / 'horse.jpg': horse,
              chars / 'sheep.jpg': sheep,
              readme / 'concept.jpg': concept,
          }

          for path, payload in outputs.items():
              if not payload.startswith(b'\xff\xd8\xff') or not payload.endswith(b'\xff\xd9'):
                  raise SystemExit(f'{path} is not a complete JPEG')
              with Image.open(BytesIO(payload)) as image:
                  image.load()
                  print(f'VALID {path}: {image.width}x{image.height}, {len(payload)} bytes')
              path.write_bytes(payload)
          PY
      - name: Commit repaired artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/characters/cow.jpg assets/characters/horse.jpg assets/characters/sheep.jpg assets/readme/concept.jpg
          git diff --cached --stat
          git commit -m 'fix: restore artwork files and correct image mapping'
          git push origin HEAD:main
