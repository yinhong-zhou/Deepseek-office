name: Inspect artwork recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-sheep.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image verifier
        run: python -m pip install --quiet pillow
      - name: Recover preview and diagnose concept
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64
          from PIL import Image

          bad = Path('assets/characters/sheep.jpg').read_bytes()
          compact = b''.join(bad.split())
          compact += b'=' * (-len(compact) % 4)
          decoded = base64.b64decode(compact, validate=True)
          if not decoded.endswith(b'\xff\xd9'):
              decoded += b'\xff\xd9'
          image = Image.open(BytesIO(decoded))
          image.load()
          image.convert('RGB').save('recovery/recovered-from-sheep.jpg', 'JPEG', quality=95, optimize=True)

          concept = Path('assets/readme/concept.jpg').read_bytes()
          Path('recovery/concept-raw.jpg').write_bytes(concept)

          lines = []
          lines.append(f'sheep raw bytes: {len(bad)}')
          lines.append(f'sheep decoded dimensions: {image.width}x{image.height}')
          lines.append(f'concept raw bytes: {len(concept)}')
          lines.append(f'concept first64: {concept[:64].hex()}')
          lines.append(f'concept last32: {concept[-32:].hex()}')

          # Best-effort JPEG marker walk for diagnosis.
          data = concept
          markers = []
          if data[:2] == b'\xff\xd8':
              i = 2
              while i < len(data) - 1 and len(markers) < 40:
                  if data[i] != 0xff:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xff:
                      i += 1
                  if i >= len(data): break
                  marker = data[i]; i += 1
                  if marker in (0x00, 0xd8, 0xd9):
                      markers.append(f'FF{marker:02X}')
                      continue
                  if marker in range(0xd0, 0xd8):
                      markers.append(f'FF{marker:02X}')
                      continue
                  if i + 2 > len(data):
                      markers.append(f'FF{marker:02X}:missing-length')
                      break
                  seglen = int.from_bytes(data[i:i+2], 'big')
                  markers.append(f'FF{marker:02X}({seglen})')
                  if seglen < 2 or i + seglen > len(data):
                      markers.append('INVALID/TRUNCATED')
                      break
                  if marker == 0xda:
                      markers.append('SOS')
                      break
                  i += seglen
          lines.append('concept markers: ' + ' '.join(markers))

          try:
              with Image.open(BytesIO(concept)) as c:
                  c.load()
                  lines.append(f'concept Pillow: OK {c.width}x{c.height} {c.format}')
          except Exception as exc:
              lines.append(f'concept Pillow: FAIL {exc!r}')

          Path('recovery/diagnostics.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY
          file recovery/* || true
      - uses: actions/upload-artifact@v4
        with:
          name: artwork-recovery
          path: recovery
          if-no-files-found: error
