name: Inspect artwork mapping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-sheep.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image verifier
        run: python -m pip install --quiet pillow
      - name: Recover previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64
          from PIL import Image

          # Copy already-valid named assets for visual mapping inspection.
          for name in ('cow.jpg', 'horse.jpg'):
              src = Path('assets/characters') / name
              Path('recovery', 'current-' + name).write_bytes(src.read_bytes())

          # sheep.jpg was accidentally committed as truncated Base64 text.
          bad = Path('assets/characters/sheep.jpg').read_bytes()
          compact = b''.join(bad.split())
          compact += b'=' * (-len(compact) % 4)
          decoded = base64.b64decode(compact, validate=True)
          if not decoded.endswith(b'\xff\xd9'):
              decoded += b'\xff\xd9'
          image = Image.open(BytesIO(decoded))
          image.load()
          image.convert('RGB').save('recovery/from-sheep-slot.jpg', 'JPEG', quality=95, optimize=True)

          # concept.jpg is a 320x320 progressive JPEG whose second DQT payload
          # lost its final three 0x30 values; insert those bytes before SOF2.
          concept = Path('assets/readme/concept.jpg').read_bytes()
          sof2 = concept.find(b'\xff\xc2')
          if sof2 < 0:
              raise SystemExit('concept slot has no SOF2 marker to repair')
          repaired = concept[:sof2] + b'\x30\x30\x30' + concept[sof2:]
          check = Image.open(BytesIO(repaired))
          check.load()
          Path('recovery/from-concept-slot.jpg').write_bytes(repaired)

          for p in sorted(Path('recovery').glob('*.jpg')):
              with Image.open(p) as im:
                  im.load()
                  print(f'{p.name}: {im.width}x{im.height}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: artwork-mapping
          path: recovery
          if-no-files-found: error
