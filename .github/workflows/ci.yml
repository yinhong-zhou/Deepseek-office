name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install dependencies
        # npm 10.9.x can crash in Arborist (`edgesOut` of null) while
        # reconciling this plugin's optional peer deps with its dev deps.
        # CI only needs a deterministic local build, so skip peer auto-resolution.
        run: npm install --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify package output
        run: |
          test -f lib/index.js
          test -f lib/client.js
          test -f lib/types/index.d.ts
